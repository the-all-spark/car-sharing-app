version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: car-sharing-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    attach: false 

  api:
    build: .
    command: npm run dev 
    container_name: car-sharing-api
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app            
      - /app/node_modules 
    environment:
      - PORT=${PORT}
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
