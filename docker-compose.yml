version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: car-sharing-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    attach: false 

  api:
    build: .
    command: npm run dev 
    container_name: car-sharing-api
    ports:
      - "3000:3000"
    volumes:
      - .:/app            
      - /app/node_modules 
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/car-sharing
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
